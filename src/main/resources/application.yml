spring:
  profiles:
    default: dev
  application:
    name: receiving
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse
    username: postgres
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always       # always / never / embedded
  security:
    user:
      name: dev
      password: dev

mybatis:
  mapper-locations: classpath:mybatis/*.xml
  type-aliases-package: com.warehouse.receiving.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.warehouse.receiving.mapper: DEBUG

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET:}