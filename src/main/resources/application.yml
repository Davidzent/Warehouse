spring:
  profiles:
    default: dev
  application:
    name: receiving
  datasource:
    url: jdbc:postgresql://localhost:5432/warehouse
    username: postgres
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never       # always / never / embedded
  security:
    user:
      name: dev
      password: dev

mybatis:
  mapper-locations: classpath:mybatis/*.xml
  type-aliases-package: com.warehouse.receiving.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.warehouse.receiving.mapper: DEBUG

server:
  port: ${PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:Zentinel-Was-Here-what-0123456789abcdef0123456789abcdef}
    allowed-origins: ${ALLOWED_ORIGINS:https://www.zntsns.com,https://zntsns.com}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    token-mint-per-minute: ${RATE_LIMIT_TOKEN_MINT:5}
    write-per-minute: ${RATE_LIMIT_WRITE:10}
    read-per-minute: ${RATE_LIMIT_READ:60}
    global-write-per-minute: ${RATE_LIMIT_GLOBAL_WRITE:60}
    max-tracked-clients: 20000
  demo:
    reset:
      enabled: ${DEMO_RESET_ENABLED:true}
      initial-delay: ${DEMO_RESET_INITIAL_DELAY:PT5M}
      interval: ${DEMO_RESET_INTERVAL:PT6H}